<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="canonical" href="https://eventeria.app/">
    <meta name="theme-color" content="#8b5cf6">
    <title>Eventeria — Find Local Events, Concerts &amp; Things To Do Near You</title>
    <meta name="description" content="Find local events, concerts, workshops, and things to do near you. Events happening near you — find something to do today, this weekend, or next month.">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Eventeria">
    <meta property="og:title" content="Eventeria — Find Local Events, Concerts &amp; Things To Do Near You">
    <meta property="og:description" content="Find local events, concerts, workshops, and things to do near you. Events happening near you — find something to do today, this weekend, or next month.">
    <meta property="og:url" content="https://eventeria.app/">
    <meta property="og:image" content="https://eventeria.app/social-og-default.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Eventeria — Find local events near you">
    <meta property="og:locale" content="en_US">
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Eventeria — Find Local Events, Concerts &amp; Things To Do Near You">
    <meta name="twitter:description" content="Find local events, concerts, workshops, and things to do near you.">
    <meta name="twitter:image" content="https://eventeria.app/social-og-default.png">
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})()</script>
    <!-- JSON-LD structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "WebSite",
          "@id": "https://eventeria.app/#website",
          "url": "https://eventeria.app/",
          "name": "Eventeria",
          "description": "Find local events, concerts, workshops, and things to do near you.",
          "inLanguage": "en",
          "publisher": { "@id": "https://eventeria.app/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://eventeria.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "@id": "https://eventeria.app/#organization",
          "name": "Eventeria",
          "url": "https://eventeria.app/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://eventeria.app/icon-512.png",
            "width": 512,
            "height": 512
          }
        }
      ]
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="legal.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="search-container">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="search-input" placeholder="Search..." autocomplete="off">
                <div id="search-dropdown" class="search-dropdown" style="display: none;"></div>
            </div>
            <button id="my-events-btn" class="icon-btn" title="My Events"><i data-lucide="heart"></i></button>
        </header>

        <!-- Geo banner — shown when nearest city is auto-detected -->
        <div id="geo-banner" style="display:none;">
            <span>Showing events near <strong id="geo-city-name"></strong></span>
            <button id="geo-change-btn">Change</button>
            <button id="geo-dismiss-btn" aria-label="Dismiss">&times;</button>
        </div>

        <!-- Filter cards — always visible on all viewports; pills live inside the panels -->
        <section class="mobile-filters" id="mobile-filters">
            <button class="filter-card" id="filter-card-categories" data-category="All"
                    aria-expanded="false" aria-controls="filter-panel-categories">
                <i data-lucide="layers" class="filter-card-icon"></i>
                <span class="filter-card-label" id="filter-card-categories-label">All Categories</span>
                <i data-lucide="chevron-down" class="filter-card-chevron"></i>
            </button>
            <div class="filter-panel" id="filter-panel-categories" aria-hidden="true">
                <section class="categories" id="filter-container"></section>
            </div>
            <button class="filter-card" id="filter-card-cities" data-city="All"
                    aria-expanded="false" aria-controls="filter-panel-cities">
                <span class="filter-card-label" id="filter-card-cities-label">All Cities</span>
                <i data-lucide="chevron-down" class="filter-card-chevron"></i>
            </button>
            <div class="filter-panel" id="filter-panel-cities" aria-hidden="true">
                <section class="categories city-filters" id="city-filter-container"></section>
            </div>
        </section>

        <!-- Events Grid -->
        <main class="events-main">
            <div class="events-header">
                <h2>Events <span id="event-count">0 Items</span></h2>
            </div>

            <section class="about-eventeria" id="about-section">
                <p class="about-cta">Have an event to share? Tap the <strong>+</strong> button to submit it.</p>
            </section>

            <div class="events-grid" id="events-grid">
                <!-- Cards will be injected via JS -->
            </div>
        </main>

        <button id="theme-toggle" class="fab-btn fab-secondary" title="Toggle Theme"><i data-lucide="moon"></i></button>
        <button id="admin-add-btn" class="fab-btn fab-primary" title="Request New Event"><i data-lucide="plus-circle"></i></button>
    </div>

    <!-- Modals -->
    <!-- Profile Modal -->
    <div class="modal-overlay" id="profile-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>User Profile</h3>
                <button class="close-btn" id="close-profile"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>Select categories to receive notifications for:</p>
                <div class="toggle-list" id="preferences-list">
                    <!-- Populated via JS -->
                </div>
                <div class="save-wrap">
                    <button class="save-btn" id="save-preferences">Save Preferences</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Modal -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Request New Event</h3>
                <button class="close-btn" id="close-admin"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body form-body">
                <div class="form-group">
                    <label for="event-title">Event Title</label>
                    <input type="text" id="event-title" placeholder="e.g., Summer Music Festival" required>
                </div>
                <div class="form-group">
                    <label for="event-email">Email Address</label>
                    <input type="email" id="event-email" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="event-category">Category</label>
                    <select id="event-category">
                        <option value="Sports">Sports</option>
                        <option value="Education">Education</option>
                        <option value="Music">Music</option>
                        <option value="Entertainment">Entertainment</option>
                    </select>
                </div>
                <div class="form-group" style="display: flex; gap: 12px;">
                    <div style="flex: 1;">
                        <label for="event-date">Date</label>
                        <input type="date" id="event-date" required>
                    </div>
                    <div style="flex: 1;">
                        <label for="event-time">Time <span style="font-weight:normal;color:var(--text-muted);">(optional)</span></label>
                        <input type="time" id="event-time">
                    </div>
                </div>
                <div class="form-group" style="display: flex; gap: 12px;">
                    <div style="flex: 2;">
                        <label for="event-location">Location</label>
                        <input type="text" id="event-location" placeholder="e.g., Central Park" required>
                    </div>
                    <div style="flex: 1;">
                        <label for="event-price">Price</label>
                        <input type="text" id="event-price" placeholder="e.g., Free, $20" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="event-address">Address <span style="font-weight:normal;color:var(--text-muted);">(optional, for map)</span></label>
                    <input type="text" id="event-address" placeholder="e.g., 801 Red River St, Austin, TX 78701" maxlength="200">
                </div>
                <div class="form-group">
                    <label for="event-city">City</label>
                    <select id="event-city" required></select>
                </div>
                <div class="form-group">
                    <label for="event-description">Description</label>
                    <textarea id="event-description" placeholder="A detailed description of the event..." style="width: 100%; min-height: 80px; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--card-radius); background: var(--bg-color); color: var(--text-color); font-family: inherit; font-size: 14px; resize: vertical;" required></textarea>
                </div>
                <!-- Recurrence -->
                <div class="form-group">
                    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:normal;">
                        <input type="checkbox" id="recurring-checkbox" style="width:16px;height:16px;cursor:pointer;">
                        <span>This is a recurring event</span>
                    </label>
                </div>
                <div id="recurrence-fields" style="display:none;">
                    <div class="form-group">
                        <label for="recurrence-type">Repeats</label>
                        <select id="recurrence-type">
                            <option value="">— select —</option>
                            <option value="daily">Daily</option>
                            <option value="weekly">Weekly</option>
                            <option value="monthly">Monthly</option>
                        </select>
                    </div>
                    <div class="form-group" id="recurrence-day-weekly-wrap" style="display:none;">
                        <label for="recurrence-day-weekly">On day</label>
                        <select id="recurrence-day-weekly">
                            <option value="0">Sunday</option>
                            <option value="1">Monday</option>
                            <option value="2">Tuesday</option>
                            <option value="3">Wednesday</option>
                            <option value="4">Thursday</option>
                            <option value="5">Friday</option>
                            <option value="6">Saturday</option>
                        </select>
                    </div>
                    <div class="form-group" id="recurrence-day-monthly-wrap" style="display:none;">
                        <label for="recurrence-day-monthly">Day of month</label>
                        <input type="number" id="recurrence-day-monthly" min="1" max="31" value="1">
                    </div>
                    <div class="form-group">
                        <label for="recurrence-end-date">Recurs until (optional)</label>
                        <input type="date" id="recurrence-end-date">
                    </div>
                </div>

                <div class="form-group">
                    <label for="event-image-file">Event Image (Local Upload)</label>
                    <input type="file" id="event-image-file" accept="image/*">
                </div>
                <div class="save-wrap">
                    <button class="save-btn" id="save-event">Submit Request</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/site-config.js"></script>
    <script src="public-config.js"></script>
    <script src="/utils-recurrence.js"></script>
    <script type="module" src="app.js"></script>

    <footer class="site-footer">
        <div class="footer-links">
            <a href="/about">About</a>
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Service</a>
            <a href="/cookies">Cookie Policy</a>
        </div>
        <div class="footer-copy">
            © <span id="footer-year"></span> Eventeria
        </div>
    </footer>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
</body>
</html>
