<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://eventhub.example.com/login">
    <meta name="theme-color" content="#8b5cf6">
    <title>Sign In · Eventeria</title>
    <meta name="description" content="Sign in to Eventeria admin.">
    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Eventeria">
    <meta property="og:title" content="Sign In · Eventeria">
    <meta property="og:url" content="https://eventhub.example.com/login">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg-color);
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--card-bg);
            border-radius: var(--card-radius);
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            padding: 36px 32px 32px;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-logo h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 0 0 4px;
            color: var(--text-color);
        }
        .login-logo p {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0;
        }
        .login-card .form-group {
            margin-bottom: 16px;
        }
        .login-card label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 6px;
            color: var(--text-color);
        }
        .login-card input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-color);
            color: var(--text-color);
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .login-card input:focus {
            border-color: var(--accent-color);
        }
        .login-submit {
            width: 100%;
            padding: 11px;
            margin-top: 8px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        #login-error {
            display: none;
            margin-top: 14px;
            padding: 10px 14px;
            background: #fdecea;
            color: #c62828;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }
        .login-footer {
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
        }
        .login-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body data-theme="">
    <div class="login-card">
        <div class="login-logo">
            <h1>Events Hub</h1>
            <p>Admin sign in</p>
        </div>

        <div class="form-group">
            <label for="login-email">Email address</label>
            <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button class="login-submit" id="login-btn">Sign In</button>

        <div id="login-error"></div>

        <div class="login-footer">
            <!-- TODO: wire to password-reset flow when auth emails are configured -->
            <a href="mailto:admin@example.com">Forgot password?</a>
        </div>
    </div>

    <script src="/site-config.js"></script>
    <script src="public-config.js"></script>
    <script type="module" src="login.js"></script>
</body>
</html>
